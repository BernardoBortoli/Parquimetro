
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parquimetro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="meter">
    <h1>Parquimetro</h1>
    <p>Insira o valor a ser pago para calcular seu tempo de estacionamento.</p>

    <label for="amount">Total a pagar (R$):</label>
    <input
      type="number"
      id="amount"
      min="0.01"
      max="1000"
      step="0.01"
      placeholder="Insira o valor em reais. Ex.: 5,00"
      inputmode="decimal"
    >

    <button id="calculate">Calcular</button>

    <section id="result" aria-live="polite">
      <h2>Informações</h2>
      <p id="message">entre o valor a ser pago para continuar.</p>
      <p id="duration"></p>
      <p id="change"></p>
    </section>

<section id="timerSection" aria-live="polite">
  <h2>Tempo restante</h2>
  <p id="timer">00:00:00</p>
  <p id="timerStatus">Nenhuma sessão ativa</p>
</section>

<dialog id="expiredDialog" aria-labelledby="expiredTitle">
  <div class="popup-content">
    <h2 id="expiredTitle">Tempo de estacionamento expirado!</h2>
    <p>Sua sessão terminou.</p>
    <p>Renove o seu plano para continuar.</p>
    <button id="closePopup" type="button">OK</button>
  </div>
</dialog>
  </main>

  <script src="script.js"></script>
</body>
</html>
