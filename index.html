
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Meter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="meter">
    <h1>🅿 Parking Meter</h1>
    <p>Enter your payment amount to calculate your parking time.</p>

    <label for="amount">Payment amount (R$)</label>
    <input
      type="number"
      id="amount"
      min="0.01"
      max="1000"
      step="0.01"
      placeholder="Example: 5.00"
      inputmode="decimal"
    >

    <button id="calculate">Calculate</button>

    <section id="result" aria-live="polite">
      <h2>Parking details</h2>
      <p id="message">Enter an amount to begin.</p>
      <p id="duration"></p>
      <p id="change"></p>
    </section>

    <!-- Countdown timer -->
<section id="timerSection" aria-live="polite">
  <h2>Time Remaining</h2>
  <p id="timer">00:00:00</p>
  <p id="timerStatus">No active parking session</p>
</section>

<!-- Expiry pop-up -->
<dialog id="expiredDialog" aria-labelledby="expiredTitle">
  <div class="popup-content">
    <h2 id="expiredTitle">⏰ Parking Time Expired!</h2>
    <p>Your parking session has ended.</p>
    <p>Please renew your parking time if needed.</p>
    <button id="closePopup" type="button">OK</button>
  </div>
</dialog>
  </main>

  <script src="script.js"></script>
</body>
</html>
